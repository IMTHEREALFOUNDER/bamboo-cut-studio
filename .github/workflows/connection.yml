name: Check Cloudflare connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify access to existing Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.STUDIO_PAGES_PROJECT || 'bamboo-cut-media' }}
        run: |
          node --input-type=module <<'NODE'
          const { CF_TOKEN: token, CF_ACCOUNT: account, CF_PROJECT: project } = process.env;
          if (!token || !/^[a-f0-9]{32}$/.test(account || '') || !/^[a-z0-9-]+$/.test(project || '')) {
            console.error('Missing token or invalid account/project configuration.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/' + project, {
              headers: { Authorization: 'Bearer ' + token },
              redirect: 'error',
              signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error('Cloudflare returned HTTP ' + response.status);
            const data = await response.json();
            if (!data.success || data.result?.name !== project) throw new Error('Project access was not confirmed');
            console.log('Cloudflare Pages connection verified. Existing project is accessible. No deployment or queue changes were made.');
          } catch (error) {
            console.error(error.message?.startsWith('Cloudflare returned HTTP ') ? error.message : 'Connection check failed; verify token scope, account and project.');
            process.exit(1);
          }
          NODE
