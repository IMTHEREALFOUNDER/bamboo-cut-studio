name: Daily measured montage
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Replace eligible future slots after collecting live analytics
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: studio-render
  cancel-in-progress: false
jobs:
  cycle:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.STUDIO_AUTOPILOT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_HOST: ${{ vars.STUDIO_SOURCE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check analytics setup
        env:
          DATABASE_URL: ${{ secrets.STUDIO_DATABASE_URL }}
          SOCIAL_TOKEN_KEY: ${{ secrets.STUDIO_SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.STUDIO_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.STUDIO_YT_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const names = {DATABASE_URL:'STUDIO_DATABASE_URL', SOCIAL_TOKEN_KEY:'STUDIO_SOCIAL_TOKEN_KEY', YT_CLIENT_ID:'STUDIO_YT_CLIENT_ID', YT_CLIENT_SECRET:'STUDIO_YT_CLIENT_SECRET'};
          const missing = Object.entries(names).filter(([key]) => !process.env[key]).map(([,name]) => name);
          if (missing.length) { console.error('Missing repository secrets: ' + missing.join(', ')); process.exit(1); }
          if (!/^[a-z0-9-]+\.pages\.dev$/.test(process.env.SOURCE_HOST || '')) throw new Error('Configure STUDIO_SOURCE_HOST');
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: .studio-state/policy.json
          key: studio-policy-v1-${{ github.run_id }}
          restore-keys: studio-policy-v1-
      - name: Collect connected Instagram and YouTube analytics
        env:
          DATABASE_URL: ${{ secrets.STUDIO_DATABASE_URL }}
          SOCIAL_TOKEN_KEY: ${{ secrets.STUDIO_SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.STUDIO_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.STUDIO_YT_CLIENT_SECRET }}
        run: |
          mkdir -p .studio-work .studio-state
          node src/metrics.mjs .studio-work/metrics.json
      - name: Read current public queue
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const response = await fetch('https://' + process.env.SOURCE_HOST + '/manifest.json', {redirect:'error', signal:AbortSignal.timeout(30000), headers:{'User-Agent':'Mozilla/5.0 (Bamboo Studio)'}});
          if (!response.ok) throw new Error('Cannot read live posting queue');
          let size = 0; const parts = [];
          for await (const part of response.body) { size += part.length; if (size > 2097152) throw new Error('Queue exceeds size limit'); parts.push(part); }
          await writeFile('.studio-work/manifest.json', Buffer.concat(parts));
          JS
      - name: Plan controlled edits for existing future slots
        id: plan
        run: |
          python src/cycle.py --manifest .studio-work/manifest.json --metrics .studio-work/metrics.json --previous .studio-state/policy.json --out .studio-work/planned --host "$SOURCE_HOST"
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises';
          const jobs = JSON.parse(await readFile('.studio-work/planned/jobs.json', 'utf8'));
          await appendFile(process.env.GITHUB_OUTPUT, 'count=' + jobs.length + '\n');
          JS
      - name: Render and fully decode edited clips
        if: steps.plan.outputs.count != '0'
        run: node src/cli.mjs --jobs .studio-work/planned/jobs.json --out dist --allow-host "$SOURCE_HOST"
      - name: Replace the planned future publication slots
        if: steps.plan.outputs.count != '0' && (inputs.publish == true || (github.event_name == 'schedule' && vars.STUDIO_AUTOPILOT_ENABLED == 'true'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.STUDIO_PAGES_PROJECT || 'bamboo-cut-media' }}
        run: node src/publish.mjs --root dist --jobs .studio-work/planned/jobs.json --base "https://$SOURCE_HOST" --project "$PAGES_PROJECT"
      - name: Persist only editing choices after a successful live cycle
        if: inputs.publish == true || (github.event_name == 'schedule' && vars.STUDIO_AUTOPILOT_ENABLED == 'true')
        run: cp .studio-work/planned/policy.json .studio-state/policy.json
      - uses: actions/cache/save@v4
        if: inputs.publish == true || (github.event_name == 'schedule' && vars.STUDIO_AUTOPILOT_ENABLED == 'true')
        with:
          path: .studio-state/policy.json
          key: studio-policy-v1-${{ github.run_id }}
      - name: Summarize cycle
        env:
          COUNT: ${{ steps.plan.outputs.count }}
          LIVE: ${{ inputs.publish == true || (github.event_name == 'schedule' && vars.STUDIO_AUTOPILOT_ENABLED == 'true') }}
        run: |
          printf 'Prepared edits: %s. Publication requested: %s. Raw analytics are not uploaded.\n' "$COUNT" "$LIVE" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove raw analytics and database-derived data
        if: always()
        run: rm -rf .studio-work
